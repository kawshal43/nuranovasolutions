spring.application.name=nuranova-education-backend

server.port=8080
server.error.include-message=always

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

spring.datasource.url=jdbc:mysql://localhost:3306/nuranova_education?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

app.security.jwt-secret=ReplaceThisWithALongerJwtSecretKeyForNuraNovaEducationPlatform12345
app.security.jwt-expiration-seconds=86400
app.security.cookie-name=nuranova_session
app.security.frontend-origin=http://localhost:5173
app.media.playback-token-expiration-seconds=900
app.storage.root=./storage
